services:
  postgres:
    image: postgres:16-alpine
    container_name: gibiconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: gibiconnect
      POSTGRES_PASSWORD: gibiconnect_secret_password
      POSTGRES_DB: gibiconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gibiconnect-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
